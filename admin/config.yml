# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Pannello /admin (Sveltia CMS). Salva gli articoli come file Markdown in _posts/ con un commit su GitHub;
# GitHub Pages poi ricostruisce il sito con Jekyll. Istruzioni complete in CLAUDE.md, sezione "Area admin".

backend:
  name: github
  repo: lavasciugapodcast-commits/site
  branch: main
  # Per ora si entra solo con un token di accesso GitHub (il pannello spiega come crearlo).
  # Pulsante "Accedi con GitHub": quando l'autenticatore (Sveltia CMS Authenticator su Cloudflare Workers,
  # vedi CLAUDE.md) è pronto, togliere il # da base_url e mettere auth_methods: [oauth, token].
  auth_methods: [token]
  # base_url: https://sveltia-cms-auth.NOME.workers.dev
  commit_messages:
    create: "Nuovo articolo: {{slug}}"
    update: "Modifica articolo: {{slug}}"
    delete: "Articolo eliminato: {{slug}}"
    uploadMedia: "Immagine caricata: {{path}}"
    deleteMedia: "Immagine eliminata: {{path}}"

site_url: https://lavasciugapodcast-commits.github.io/site/
display_url: https://lavasciugapodcast-commits.github.io/site/
logo_url: ../assets/logo-192.png

# Immagini caricate dal pannello: nel repository in assets/blog/, nel testo come /assets/blog/... (il modello
# degli articoli corregge il percorso da solo)
media_folder: assets/blog
public_folder: /assets/blog

# Indirizzi senza accenti né caratteri strani (es. "Perché sì" -> perche-si)
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: articoli
    label: Articoli
    label_singular: Articolo
    description: Gli articoli del blog (Generale, Arte, Sport, Cucina, Finanza). Un articolo nuovo nasce come bozza (offline); quando attivi "Online" e salvi, compare sul sito in un paio di minuti.
    folder: _posts
    create: true
    delete: true
    # Jekyll vuole i nomi file AAAA-MM-GG-titolo.md; l'indirizzo sul sito sarà /blog/titolo.html
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{published | ternary('Online', 'Bozza')}} · {{title}} · {{categories}} · {{date | date('D/M/YYYY')}} · {{autore}}"
    sortable_fields: [date, title, autore]
    view_filters:
      - { label: Bozze (offline), field: published, pattern: false }
      - { label: Online, field: published, pattern: true }
    fields:
      # published è il campo di Jekyll: con false l'articolo non viene pubblicato (non ha pagina e non compare
      # negli elenchi), ma il file resta nel repository e si può rimettere online in qualsiasi momento.
      - name: published
        label: Online
        widget: boolean
        default: false
        hint: "Spento = bozza: l'articolo è salvato ma non compare sul sito. Accendilo e salva per pubblicarlo; spegnilo per toglierlo dal sito senza cancellarlo."
      - name: title
        label: Titolo
        widget: string
      - name: evidenzia
        label: Parole da evidenziare nel titolo
        widget: string
        required: false
        hint: "Facoltativo. Una o due parole del titolo, scritte identiche, da mettere in rosa (es. ciclo delicato)."
      - name: lead
        label: Sottotitolo
        widget: text
        hint: "Una o due frasi che riassumono l'articolo. Compare sotto il titolo, nell'elenco del blog e nelle anteprime sui social."
      - name: date
        label: Data
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      # Categoria del blog: decide in quale pagina (e voce del sottomenu Blog) compare l'articolo.
      # L'indirizzo resta /blog/titolo.html qualunque sia la categoria.
      - name: categories
        label: Categoria
        widget: select
        options:
          - { label: Generale, value: generale }
          - { label: Arte (musica, cinema, teatro, libri…), value: arte }
          - { label: Sport, value: sport }
          - { label: Cucina, value: cucina }
          - { label: Finanza, value: finanza }
        default: generale
        hint: "La categoria del blog in cui compare l'articolo."
      # Un profilo della collezione "Autori" (nel file resta il suo id, es. redazione-lavasciuga)
      - name: autore
        label: Autore
        widget: relation
        collection: autori
        display_fields: [nome]
        search_fields: [nome]
        default: redazione-lavasciuga
        hint: "Scegli l'autore dall'elenco. Se non c'è, crealo con il pulsante qui sotto: nome, foto, due righe di presentazione e i link ai suoi profili compariranno nel box 'Chi è l'autore' in fondo all'articolo."

      - name: copertina
        label: Immagine di copertina
        widget: image
        required: false
        hint: "Facoltativa. Meglio orizzontale, almeno 1200 px di larghezza."
      - name: copertina_alt
        label: Descrizione dell'immagine
        widget: string
        required: false
        hint: "Cosa si vede nell'immagine, per chi non può vederla (accessibilità)."
      - name: episodio
        label: Episodio collegato
        widget: string
        required: false
        hint: "Facoltativo. Incolla il link dell'episodio su Spreaker: in fondo all'articolo comparirà il box 'Ne abbiamo parlato in puntata'."
      # Box "Da ascoltare, guardare, leggere" in fondo all'articolo, prima del box dell'autore
      - name: link
        label: Link
        label_singular: Link
        widget: list
        required: false
        summary: "{{titolo}}"
        hint: "Facoltativo. Canzoni, video, articoli citati: compaiono in un elenco in fondo all'articolo, con il nome della piattaforma (YouTube, Spotify…) riconosciuto dall'indirizzo."
        fields:
          - name: titolo
            label: Titolo
            widget: string
            hint: "Cosa si apre, es. Fabrizio De André — La guerra di Piero"
          - name: url
            label: Indirizzo completo
            widget: string
            pattern: ['^https?://', "Deve iniziare con https://"]
          - name: nota
            label: Nota
            widget: string
            required: false
            hint: "Facoltativa. Una riga di contesto, es. Ascoltatela prima di leggere il secondo paragrafo."
      - name: body
        label: Testo
        widget: markdown
        hint: "Usa i titoletti (H2) per dividere l'articolo in parti: i banner 'Sostieni' si posizionano da soli tra una parte e l'altra."

  # Profili degli autori: uno per file in _data/autori/<id>.yml. Nel sito: box "Chi è l'autore" in fondo agli articoli.
  - name: autori
    label: Autori
    label_singular: Autore
    description: I profili di chi scrive. Il box "Chi è l'autore" in fondo agli articoli prende da qui nome, foto, presentazione e link.
    folder: _data/autori
    extension: yml
    format: yml
    create: true
    delete: true
    identifier_field: nome
    slug: "{{nome}}"
    summary: "{{nome}}"
    media_folder: /assets/autori
    public_folder: /assets/autori
    fields:
      - name: nome
        label: Nome e cognome
        widget: string
      - name: foto
        label: Foto
        widget: image
        required: false
        hint: "Facoltativa. Quadrata, viso ben visibile: verrà ritagliata in un cerchio. Senza foto compare l'iniziale del nome."
      - name: bio
        label: Presentazione
        widget: text
        required: false
        hint: "Due o tre frasi: chi è, di cosa scrive."
      - name: social
        label: Link ai profili
        label_singular: Link
        widget: list
        required: false
        summary: "{{piattaforma}}"
        fields:
          - name: piattaforma
            label: Piattaforma
            widget: select
            options: [Instagram, TikTok, YouTube, Facebook, X, Threads, Bluesky, LinkedIn, Spotify, Twitch, Linktree, Sito web, Altro]
          - name: url
            label: Indirizzo completo
            widget: string
            hint: "Il link completo, es. https://www.instagram.com/nomeutente"
            pattern: ['^https?://', "Deve iniziare con https://"]

